# Curse of Strahd -- every label a human authors by hand.
#
# Three blocks, `locations`, `artifacts` and `aliases`, in ONE file loaded ONE
# way. They are the same kind of claim -- a person naming something the text
# does not mark -- and splitting them across three files would be three
# mechanisms that drift.
#
# =========================== LOCATIONS ===========================
#
# The hand-authored half of the LOCATION hierarchy.
#
# Only REGION, SETTLEMENT and WILD appear here. SITE and AREA are DERIVED from
# the book's own key convention -- an unsuffixed key like `E5` is a building, a
# suffixed one like `E5g` is a room inside it -- and the loader refuses either
# of them in this file. A hand-authored SITE would be a human guessing at
# something the deterministic layer already answers, and that layer is the only
# part of this pipeline that has never been wrong.
#
# Nothing infers these from a name. "Village of" would classify Barovia and
# then mislabel the next book's Villagers' Rest; a wrong rung is worse than no
# rung because it is indistinguishable in the graph from a checked one. A place
# absent from this file and unreachable by a key stays plain `:LOCATION`, on
# purpose: an unclassified place must be visibly unclassified.
#
# Matched on the SLUG of the name, the way `mint_id` mints ids, so a straight
# and a curly apostrophe are one entry. `aliases` exists for the case where the
# extractor's spelling and the chapter title's genuinely differ -- listing both
# by hand is authorship, not a fuzzy match.
#
# Roughly fifteen entries covers the whole book. This is not a place to be
# thorough; it is a place to be right.

locations:
  # --- The land itself ---
  - name: Barovia
    subtype: REGION
    note: >-
      The valley, the domain, and the mist-walled demiplane. The extractor also
      types this SETTING in places, which is a disagreement about a label rather
      than about the world -- the node wears both, and this rung sits beside them.

  # --- Settlements ---
  # The village and the valley share a name in the book's prose. They are not
  # the same place, and only the longer form ever names the village.
  - name: Village of Barovia
    aliases:
      # The chapter title, which is what `place_from_chapter_title` yields and
      # therefore what the chapter's own place node is called.
      - The Village of Barovia
    subtype: SETTLEMENT
  - name: Vallaki
    subtype: SETTLEMENT
  - name: Krezk
    aliases:
      - Village of Krezk
    subtype: SETTLEMENT

  # --- Wilderness ---
  - name: Svalich Woods
    subtype: WILD
  - name: Old Svalich Road
    subtype: WILD
  - name: Tsolenka Pass
    subtype: WILD
  - name: Yester Hill
    subtype: WILD

# =========================== ARTIFACTS ===========================
#
# The three items the Tarokka reading sends the party after. They wear
# `:Artifact` BESIDE `:ITEM`, never instead of it, and `MATCH (n:Artifact)` is
# the query a DM runs constantly -- one a flat :ITEM, with Sunsword filed beside
# oil lamp and tinderbox, cannot answer at all.
#
# Not a rung and not a ladder: there is ONE item label. `:Book` and `:mundane`
# were both considered and rejected -- nobody would ever traverse the first, and
# the second is the absence of significance, which is honestly encoded as the
# absence of a label. An item missing from this list stays plain `:ITEM`, the
# same no-default rule the locations above follow.
#
# Names only, because an entry is a membership claim rather than a
# classification. Matched on the SLUG of the WHOLE name and NEVER on a
# substring: chapter 3's `Holy Symbol` is a wooden sun-shaped one nailed to a
# church wall, and a substring match would quietly make it the Holy Symbol of
# Ravenkind -- a wrong label no query could see.
artifacts:
  - Tome of Strahd
  - Holy Symbol of Ravenkind
  - Sunsword

# ============================ ALIASES ============================
#
# The names the book actually writes, for entities whose canonical name it
# rarely spells in full. Each becomes an `(:Alias)-[:ALIAS_OF]->(:Entity)`, and
# the mention scan looks for every one of them.
#
# THIS IS THE FILE'S REASON FOR EXISTING, restated: the graph knew one node
# called `Strahd von Zarovich`, that exact string occurs in ONE of chapter 3's
# twenty-two sections, and the other seven write `Strahd`. Adding one line below
# takes him from 1 mention to 8. Nothing infers it -- not a prefix rule, not a
# first-token rule, not an edit distance. Every one of those would have been
# right here and wrong elsewhere, and two of them have already cost this project
# weeks: a token-subset match let a candidate `Ireena` credit the quest `Escort
# Ireena to Vallaki`, which is how a ten-line regex outscored a real extractor.
#
# The entity's own name is ALWAYS an alias and is never listed here. Only the
# extra spellings go in.
#
# Matched on the SLUG of `name` OR of any alias, the way the location rungs are,
# so one entry covers a straight and a curly apostrophe and the seed does not
# have to know which spelling the extractor's provenance tiebreak minted the
# node under.
#
# THE BAR FOR AN ENTRY: the book writes this spelling, and the spelling names
# this thing and no other. `Mary` fails it -- the foreword's Mary is Mary
# Shelley, and the alias would have credited Mad Mary with the invention of
# Frankenstein. That is the failure mode the whole no-inference rule guards
# against, and it is one line away in every direction.

aliases:
  # --- People ---
  # 8 of chapter 3's 22 sections. The measurement this design was built on.
  - name: Strahd von Zarovich
    aliases:
      - Strahd
  # The chapter's prose never spells his patronymic; his NPC block does.
  # "Ismark the Lesser" is the book's own epithet, in the tavern section.
  - name: Ismark Kolyanovich
    aliases:
      - Ismark
      - Ismark the Lesser
  - name: Ireena Kolyana
    aliases:
      - Ireena

  # Short forms the book itself uses. Each was checked by counting its
  # STANDALONE occurrences across the WHOLE corpus -- occurrences that are not
  # part of the full name -- before being written here. Chapter-only checking is
  # not enough, and three of the six candidates died on the corpus-wide pass.
  - name: Bildrath Cantemir
    aliases:
      - Bildrath        # 6 standalone, every one the man
  - name: Arik Lorensk
    aliases:
      - Arik            # 2 standalone, both the barkeep
  - name: Kolyan Indirovich
    aliases:
      - Kolyan          # 3 standalone, all the burgomaster
  #
  # REJECTED, and the reasons are the bar. Each looked obvious and each is wrong:
  #
  #   Eva     -> Madam Eva.      0 standalone. The book always gives her the
  #                              honorific, so the alias would name nobody here
  #                              and wait to catch some other Eva later.
  #   Mary    -> Mad Mary.       5 standalone, of which the foreword's are Mary
  #                              SHELLEY and the credits' a Mary Hershey.
  #   Lucian  -> Lucian Jarov.   15 standalone, nearly all Father Lucian
  #                              Petrovich of Vallaki -- a different person.
  #                              The alias would move a priest's whole life onto
  #                              a seven-year-old boy.
  #   Blinsky -> Gadof Blinsky.  31 standalone, mostly "Blinsky toy" -- the
  #                              brand stamped on an object, not the toymaker.
  #
  # The pattern in all four: a short form is only a name when the book uses it
  # AS one. Frequency is not evidence; checking where it lands is.

  # --- Places ---
  # The settlement, not the valley. `Barovia` alone is the REGION and stays
  # deliberately absent from here: the two are different places that share a
  # word, and an alias would merge them.
  - name: The Village of Barovia
    aliases:
      - Village of Barovia
  - name: Krezk
    aliases:
      - Village of Krezk
  # The book names the tavern twice and differently on purpose: the sign
  # outside is defaced so that an "n" is scratched over the "f", and chapter 3
  # calls it "the Blood on the Vine tavern" in the same breath as the heading
  # "E2. Blood of the Vine Tavern".
  - name: Blood of the Vine Tavern
    aliases:
      - Blood on the Vine Tavern
      - Blood on the Vine

  # --- Typography ---
  # The book sets its possessives with U+2019 and the extractor emits an ASCII
  # quote, so a keyed room is minted under whichever one won the provenance
  # tiebreak. Both spellings are recorded so that `USES_ALIAS` can say which one
  # a section actually set -- the scan folds the two together and so would find
  # these anyway, which is exactly why the SURFACE FORM has to be written down
  # rather than inferred from the match.
  - name: Bildrath's Mercantile
    aliases: ["Bildrath’s Mercantile"]
  - name: Burgomaster's Mansion
    aliases: ["Burgomaster’s Mansion"]
  - name: Mad Mary's Townhouse
    aliases: ["Mad Mary’s Townhouse"]
  - name: Donavich's Bedroom
    aliases: ["Donavich’s Bedroom"]
  - name: Doru's Bedroom
    aliases: ["Doru’s Bedroom"]
