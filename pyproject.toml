[project]
name = "agentic-dm"
version = "0.1.0"
description = "AI-powered D&D Dungeon Master Assistant"
requires-python = ">=3.12"
dependencies = [
    # Core
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.12.3",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.2.1",
    # LLM & Embeddings
    "openai>=2.6.1",
    "tiktoken>=0.8.0",
    # Vector Database
    "chromadb>=0.5.0",
    # Graph Database
    "neo4j>=6.0.2",
    # PDF Processing
    "pymupdf>=1.25.0",
    # NER & NLP
    "spacy>=3.8.0",
    "rapidfuzz>=3.0.0",
    "pyahocorasick>=2.0.0",
    # Agent Protocol. HELD BELOW 2.0: mcp 2.x renamed `FastMCP` to `MCPServer`
    # and `backend/mcp-server/server.py` is written against the v1 API. 1.28.1
    # is the patched release for every advisory open against it, so the ceiling
    # costs nothing but the migration -- which is a refactor, not a bump, and
    # is not what a dependency pass should smuggle in.
    "mcp>=1.28.1,<2",
    # Utilities
    "pyyaml>=6.0.3",
    "httpx>=0.28.0",
    "tenacity>=9.0.0",
    "en-core-web-sm",
    # Audio transcription
    "deepgram-sdk>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[project.scripts]
ingest-pdf = "backend.scripts.ingest_pdf:main"
process-transcript = "backend.scripts.process_transcript:main"

[tool.setuptools.packages]
find = { where = ["."], include = ["backend*"] }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
markers = [
    "neo4j: test requires a running Neo4j (docker compose up -d); deselect with -m 'not neo4j'",
]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
