# Whether the ANSWER is right, which `canon-questions.yaml` deliberately does
# not ask.
#
# That set scores whether the right SECTION was retrieved, and says so in its
# own header: "whether an answer written from that section would be any good is
# a different question and is not asked here". At 83% section recall that
# question is now the binding one. The diagnosis that prompted this: asked "who
# is Strahd's chamberlain", the agent receives ZERO derived relationships and
# FORTY-THREE guessed ones, of which twelve are shown -- including
# `Strahd SEEKS Yester Hill`, `Strahd GUARDS Stone Bridge` and
# `Strahd KNOWS Davian Martikov` -- and not one of them is the answer.
#
# HOW A CHECK IS MADE, AND WHY NOT A JUDGE. Every field below is a plain
# case-insensitive substring test over the answer text. No model grades another
# model's output. That is the same rule the retrieval set follows and it exists
# for the same reason: a judge's verdict is another guess, and a suite built out
# of guesses cannot tell you when it is the suite that is wrong.
#
#   must      strings a correct answer HAS to contain. Names and numbers only --
#             never a phrasing, because a model is free to word things its own
#             way and a suite that pins prose measures style.
#
#             THE AUTHOR'S BIAS, RECORDED BECAUSE IT RECURRED THREE TIMES: it
#             is easy to write down what a GOOD answer ought to mention instead
#             of what a CORRECT one cannot omit. a02 demanded `padlock` and
#             failed seven correct answers that said "chain"; a05 demanded the
#             lich's name from a section whose point is that he has forgotten
#             it; a09 demanded a refusal to a question the book answers. Every
#             one was the suite being wrong, and every one looked like a model
#             failure until somebody read the text. If a check fails, read the
#             answer before believing it.
#   must_not  strings that, appearing at all, mean something went wrong. These
#             are TRIPWIRES, NOT PROOF: a trip means read the answer, not that
#             the answer is definitely bad. Each one names why it is here.
#   cites     whether the answer must carry a [n] citation.
#   refuses   the answer must say the canon does not cover this. For questions
#             the book genuinely does not answer, where the ONLY correct
#             behaviour is declining -- and the failure mode is a fluent,
#             confident, invented answer that a DM cannot tell from a real one.
#
# `note` is the hand-checked answer, carried so a reader can judge the check
# rather than trusting it. Facts are drawn from the notes in
# `canon-questions.yaml`, which were verified against the book one by one.

questions:
  # -- retrieval succeeds; does the answer use it? ------------------------
  - id: a01
    question: "Who owns the Blood of the Vine Tavern?"
    must: ["Alenka", "Mirabel", "Sorvia"]
    cites: true
    note: >-
      Three Vistani. This is the question that exposed the decorative RAG path:
      the section was retrieved, the three OWNS edges existed and had been
      accepted by a human, and the model still answered that canon did not
      cover it. All three names are required, because naming one is the shape
      of an answer written from the passage's first sentence.

  - id: a02
    question: "How do the characters open the trapdoor in the church?"
    must: ["chain", "12"]
    cites: true
    note: >-
      The chain comes off, then a DC 12 Strength check against a door swollen in
      its frame.

      *Corrected after measuring.* This required `padlock` and scored 3/10. All
      ten answers were RIGHT -- "remove the chain that holds it shut, then a DC
      12 Strength check" -- and seven of them simply did not use the word, which
      describes the chain rather than the procedure. The two steps a DM performs
      are the chain and the check, and every answer had both.

  - id: a03
    question: "What guards the madhouse at the abbey?"
    must: ["golem"]
    cites: true
    note: >-
      A flesh golem the Abbot made. Retrieval reaches this one cleanly, so a
      failure here is the model rather than the graph -- which is what makes it
      worth keeping in a set about answers.

  - id: a04
    question: "What does Morgantha grind in the mill?"
    must: ["bone"]
    cites: true
    note: Children's bones, for the powder in her dream pastries.

  - id: a05
    question: "Where in the Amber Temple do the characters meet a lich?"
    must: ["X27"]
    cites: true
    note: >-
      The lich's lair, area X27. Exethanter, though the section withholds that.

      *CHANGED TWICE, AND THIS RECORDS BOTH.* It began as `X27`, which failed an
      answer naming the Lich's Lair and describing the skeleton, so I switched
      it to `Exethanter` on the argument that `must` is for facts and an area
      code demands a FORMAT.

      That was wrong. The section's whole point is that the lich HAS FORGOTTEN
      ITS NAME, so a faithful answer written from it says exactly that and
      cannot produce "Exethanter" -- the model's answer did say it, and was
      marked failing three runs out of three. An area code is not a format
      here: it is how this book is navigated and what a DM turns to, and the
      model produces it unprompted. The first version was right.

      The lesson is about the harness, not the question. A `must` string has to
      be something a CORRECT answer must contain, and I twice reasoned about
      what a good answer OUGHT to contain instead.

  # -- a broad anchor, and a wall of guesses ------------------------------
  - id: a06
    question: "Who is Strahd's chamberlain?"
    must: ["Rahadin"]
    must_not:
      # Every one of these is an entity the extractor attached to Strahd by a
      # guessed edge that reaches this exact question. None is his chamberlain,
      # so any of them appearing in an answer about who is means the model
      # took a relationship list for an answer.
      - "Davian"
      - "Ireena"
      - "Tatyana"
    cites: true
    note: >-
      Rahadin, his dusk elf chamberlain. THE HARDEST CASE IN THE SET: the model
      receives twelve guessed relationships about Strahd and zero derived ones,
      and the answer is in a passage that only reaches it through the text path.

  - id: a07
    question: "Does Strahd guard the stone bridge?"
    must_not:
      # `Strahd von Zarovich -GUARDS-> Stone Bridge` is in the guessed edges
      # shipped for any question naming Strahd. It is not in the book. An
      # answer that affirms it is the failure this whole set exists to catch:
      # a false extraction laundered into prose a DM will act on.
      - "yes, strahd guards"
      - "strahd guards the stone bridge"
    note: >-
      No. The extractor produced this edge and it is wrong. A good answer says
      the canon does not support it, or describes what the book does say about
      the bridge, and does not assert the guarding.

  # -- the book does not answer this; declining is the only right move ----
  - id: a08
    question: "What are the stat blocks for the beholder in Castle Ravenloft?"
    refuses: true
    must_not:
      # ADDED AFTER READING THE FIRST RUN. The model declined correctly -- "the
      # canon does not cover the stat blocks for a beholder in Castle
      # Ravenloft" -- and then supplied them from memory anyway: challenge
      # rating 13, Antimagic Cone, Eye Rays. Declining about the CANON and then
      # answering from the Monster Manual is the same outcome for a DM as never
      # declining, and `_NO_CANON` explicitly instructs against it.
      #
      # This is what the mandatory reading of every refusal is for: a human saw
      # it, and it becomes a mechanical check so nobody has to see it twice.
      - "antimagic cone"
      - "challenge rating"
      - "eye ray"
    note: >-
      There is no beholder in Curse of Strahd. The failure mode is a fluent
      invented answer, and a DM cannot tell one of those from a real one until
      it fails at the table.

  - id: a09
    question: "How much does Bildrath charge for a healing potion in gold pieces?"
    must: ["ten times"]
    note: >-
      Ten times list price, on Adventuring Gear under 25 gp -- so he does not
      stock a healing potion at all.

      *Corrected on its first run.* This was marked `refuses`, on my assumption
      that the book gives no price. It does better than that: the model
      answered with the markup, the 25 gp ceiling, and the conclusion that a
      50 gp potion falls outside what he sells, cited. The EXPECTATION was
      wrong, and the harness reported "DID NOT decline" rather than failing the
      run -- which is exactly why `refuses` is never scored automatically. A
      suite that could fail on its author's wrong assumption would have marked
      a better-than-expected answer as a defect.

  # -- retrieval fails; the model must not paper over it ------------------
  - id: a10
    question: "Where are the Vistani camps?"
    must: ["Tser Pool"]
    cites: true
    note: >-
      Two: Tser Pool, and one outside Vallaki. Written when this was an
      anchored miss for retrieval, so a `must` failure was EXPECTED and the
      question pinned whether the model invents a location or says it has
      none. That is no longer the state: measured 2026-09-01 at 28/28 against
      8/30 in `2026-08-26-edges-as-shipped`, and Tser Pool now arrives in the
      retrieved text. Which change fixed it is not known -- six days and many
      commits separate the two runs, and no answer baseline was recorded in
      between. The question is now an ordinary pass and a failure here would
      be a regression rather than the point.

# ---------------------------------------------------------------------------
# KEYS FROM THE GOLDEN VAULT.
#
# The ten questions above are all Curse of Strahd, so every answer-quality
# figure this project has reported describes one book -- the same flaw the
# retrieval suite carried until Golden Vault questions were added to it. These
# make the other half of the answer measurable.
#
# `book` is DECLARED here rather than derived, unlike the retrieval set. Those
# questions carry a gold section id whose prefix names the book; an answer
# question has no gold section to read one off, so there is nothing to count
# and the field is honest about that. Absent means `cos`, which is what the
# ten above are.
#
# `must` ENTRIES ARE PROPER NOUNS AND NUMBERS wherever possible. a02 is the
# lesson: it required the word `padlock`, scored 3/10, and every one of the ten
# answers was correct -- seven simply described the chain without using the
# word. A name or a DC is a thing an answer either has or has not; an adjective
# is a paraphrase waiting to happen.

  - id: b01
    book: kftgv
    question: "Who approaches the party with the job in Prisoner 13, and what do they want?"
    must: ["Varrin"]
    cites: true
    note: "Varrin Axebreaker, a dwarf noble, wants a key recovered from the prison."

  - id: b02
    book: kftgv
    question: "How does the suspicion track at Revel's End work, and what level do the characters start at?"
    must: ["1", "6"]
    cites: true
    note: >
      Levels 1 to 6, starting at 1. Both numbers, because an answer naming only
      the range has not said where play begins and an answer naming only the
      start has not said what it climbs toward.

  - id: b03
    book: kftgv
    question: "What is the Golden Vault's motto?"
    must: ["Do good"]
    cites: true
    note: "\"Do good, no matter the cost.\" Quoted verbatim in the introduction."

  - id: b04
    book: kftgv
    question: "Who is the curator of the museum in Varkenbluff?"
    must: ["Alda Arkin"]
    cites: true
    note: "Alda Arkin, a retired professor, neutral evil, at the gala unarmed."

  - id: b05
    book: kftgv
    question: "What can an employee pass card do in the Afterlife Casino, and how hard is it to steal one?"
    must: ["15"]
    cites: true
    note: >
      Opens any locked door, bypassing the arcane lock; DC 15 Sleight of Hand.
      The DC is the checkable half -- 'opens locked doors' is paraphrasable a
      dozen ways and the number is not.

  - id: b06
    book: kftgv
    question: "Who does the Afterlife Casino employ?"
    must: ["tiefling"]
    cites: true
    note: "Tieflings only, which is what makes a disguise the party's problem."

  - id: b07
    book: kftgv
    question: "Where is the Murkmire Stone kept during the gala, and what happens to it at midnight?"
    must: ["hatch"]
    cites: true
    note: >
      On a pedestal in the Gemstone Wing; the egg hatches at midnight. `hatch`
      rather than `Gemstone Wing`, because the thing a DM must not be surprised
      by is that the exhibit is an egg on a timer.

  - id: b08
    book: kftgv
    question: "What happens if Vidorant is alerted that the diadem has been taken?"
    must: ["teleport"]
    cites: true
    note: >
      A custom ring functioning as a helm of teleportation brings her to the
      balcony five rounds after the alarm. The teleport is the fact that
      changes how the escape is run.

  - id: b09
    book: kftgv
    question: "Who built the clockwork automatons threatening Little Lockford?"
    must: ["Tockworth"]
    cites: true
    note: "Tixie Tockworth, a gnome tinkerer who replaced her own body with machinery."

  - id: b10
    book: kftgv
    question: "Who is the mayor of Toadhop?"
    must: ["Jenna Bean"]
    cites: true
    note: >
      A brown sow with 'Mayor' painted on her flank. Included deliberately: an
      answer that reaches for a plausible human name instead of the book's
      actual joke is the exact failure mode grounding is supposed to prevent.
