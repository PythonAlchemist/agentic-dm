  # *Corrected 2026-08-18.* Both of these pointed at
  # `cos:the-village-of-barovia#21`, which is the section headed "Dream
  # Pastries" -- Morgantha selling to villagers, and the gold for q13 and q14
  # directly above. Neither question can be answered from it, so both were
  # unhittable by any retrieval whatsoever, and both spent months being counted
  # as "anchored but missed" -- the bucket that means RANKING is at fault. Two
  # rounds of ranking work were aimed partly at them.
  #
  # Found by reading every gold heading back against its own note, which is now
  # the standing check: a gold is only as good as somebody having looked at it.
  # The other 44 were correct.
  - id: q21
    question: "Where are the Vistani camps?"
    sections: ["cos:the-lands-of-barovia#49", "cos:the-town-of-vallaki#93"]
