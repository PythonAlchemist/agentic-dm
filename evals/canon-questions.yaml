  # ====================================================================
  # SET TWO, authored 2026-08-18. Fifty questions carrying a `needs`
  # field, over the twelve chapters set one never touched.
  #
  # WHY THE SECOND SET EXISTS. Set one measures ONE NUMBER over a mixed
  # bag, and 22 of its 51 gold references are in a single chapter. It
  # cannot answer the question that now matters most: which PATH is
  # earning its keep. The text index alone outscores the graph path on
  # section recall, the graph path reaches none of the misses at any
  # depth, and neither fact says whether the two are good at DIFFERENT
  # things or whether one is redundant.
  #
  # `needs` IS A PREDICTION, MADE BEFORE RUNNING ANYTHING:
  #
  #   graph   the question names a proper noun the graph should hold, and
  #           the answer lives in a section that name reaches. Its other
  #           words are mostly absent from that section, so a keyword
  #           search has little to lock onto.
  #   text    the question names NO proper noun. It describes the thing
  #           instead, in wording close to the book's own, which is all a
  #           full-text index needs and all a name-resolver cannot use.
  #   either  both: it names an entity AND echoes the section's phrasing.
  #
  # The label is falsifiable, which is the point. `graph` predicts the
  # question anchors and a resolved name answers it; `text` predicts it
  # anchors on nothing. Every disagreement between the prediction and
  # `hit_path` is a fact about the system that no aggregate recall shows.
  #
  # MATCHED PAIRS. Several questions share a gold section with a
  # differently-phrased twin -- q47/q48, q53/q54, q60/q61, q68/q69 --
  # one naming the entity and one describing it. Same answer, same
  # ranking, one variable: whether a name was available. That is the only
  # clean way to attribute a difference to the path rather than to the
  # question being easier.
  #
  # AUTHORED FROM THE BOOK, NOT THE GRAPH, and I have to be straight
  # about the weaker claim here than set one could make: I have spent
  # this session reading retrieval output, so I cannot say I was blind to
  # the system the way set one's author was. What I did instead is write
  # every question and its `needs` label from the chapter markdown with
  # the graph unqueried, and fix the file before running the eval once.
  # Notes paraphrase; no book text is reproduced here.

