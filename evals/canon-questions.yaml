  # ==================================================================
  # SECOND SET, written 2026-08-17 after the whole book was loaded.
  #
  # WHY IT EXISTS. The 24 questions above all have gold in three of the
  # book's twenty-four chapters -- the 12% that was written when they were
  # authored. Tuning retrieval against them optimises for finding chapter 3,
  # and measurably did: every ranking variant tried returned village-of-barovia
  # sections most often. A ranking change cannot be trusted until the
  # measurement spans the corpus it runs on.
  #
  # Same discipline as the first set: written from `data/ddb/cos/*.md` before
  # running retrieval, gold is section ids, notes paraphrase rather than quote.
  # ==================================================================

  # *Widened 2026-08-18, and the ORIGINAL GOLD WAS THE WORSE OF THE TWO.* Both
  # sections are headed "Rahadin". `castle-ravenloft#7` is a random-encounter
  # entry -- "If Rahadin was killed or captured in a previous encounter, this
  # encounter doesn't occur" -- followed by a d6 table of where he leads you.
  # `appendix-d#28` opens "Rahadin, the dusk elf chamberlain of Castle
  # Ravenloft, has served Strahd's family faithfully for nearly five hundred
  # years", which is the answer to the question as asked. Retrieval was
  # returning THAT at rank 3 and being scored a miss.
  #
  # The encounter is kept rather than replaced: a DM asking who the chamberlain
  # is may well want the scene in which he turns up.
  - id: q25
    question: "Who is Strahd's chamberlain?"
    sections:
      - "cos:appendix-d-monsters-and-npcs#28"
      - "cos:castle-ravenloft#7"
    anchor_hint: "Rahadin"
    note: "Rahadin. He approaches quietly and summons the party to his master."

