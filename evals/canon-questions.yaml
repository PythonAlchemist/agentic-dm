# Retrieval evaluation set for the canon graph.
#
# HOW THIS WAS BUILT, BECAUSE IT DETERMINES WHETHER THE NUMBERS MEAN ANYTHING.
# Every question was written while reading `data/ddb/cos/*.md`, BEFORE running
# retrieval and without checking what the graph contains. Questions authored
# against the graph would measure nothing: recall is monotone in what you ask
# for, and this project has already watched a ten-line regex outscore the tuned
# pipeline on every recall number by exploiting exactly that.
#
# GOLD IS IDS, NEVER PROSE. `sections` names the passage a DM would have to
# read to answer the question. It is checkable mechanically, needs no judge,
# and keeps copyrighted book text out of the repository. `note` paraphrases the
# answer for a human reviewing this file; nothing scores against it.
#
# `anchor_hint` is the name a reader would expect the question to resolve
# through. It is DIAGNOSTIC ONLY and never scored -- it is there so a miss can
# be read as "the anchor never resolved" rather than just "missed".
#
# Two questions at the end name nothing the graph can anchor on; they are kept
# deliberately, because a retrieval system that cannot say "I have no handle on
# this" is worse than one that can.
#
# GOLD MAY NAME MORE THAN ONE SECTION, AND MUST WHEN THE BOOK ANSWERS TWICE.
# Audited fully on 2026-08-18, in two passes that ask different things:
#
#   1. does each gold answer its question?  Two did not -- q21 and q22 both
#      pointed at "Dream Pastries", which is q13's and q14's gold. Corrected.
#   2. does the book ALSO answer it somewhere unlisted?  Two did -- q22 through
#      Appendix D's Vladimir Horngaard entry, and q25 through Appendix D's
#      Rahadin entry, which is a BETTER answer than the encounter that was
#      listed. Both widened.
#
# Only the first pass had ever been run, and on its own it is misleading: a
# perfectly correct gold still scores retrieval a miss for returning the book's
# other correct section, and that miss lands in `anchored but missed` -- the
# bucket that says RANKING is at fault. It sent two rounds of work in the wrong
# direction. `backend.scripts.audit_questions` runs the second pass now, so it
# is a command rather than something somebody has to think to do.
#
# Widening a gold raises the score, which makes it the one edit here that can
# become tuning the ruler. The rule: a section joins a gold only if it answers
# the question ON ITS OWN, judged by reading it, and the reason is written into
# this file beside the entry. The remaining 44 were read and left alone --
# `N7. Blinsky Toys` never mentions Mary's doll, and Appendix D's Abbot entry
# describes his golem BRIDE rather than the madhouse's guardian.

