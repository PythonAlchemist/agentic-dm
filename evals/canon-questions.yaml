# ---------------------------------------------------------------------------
# KEYS FROM THE GOLDEN VAULT.
#
# Added because every number this project reported described ONE book. The 96
# questions above are all Curse of Strahd, so 85%/90%/MRR 0.61 was a Barovia
# measurement being read as the system's -- while a campaign was being run out
# of the heist anthology on the strength of it.
#
# Written the same way as the set above and for the same reason: while reading
# the chapter text, before running retrieval, without checking what the graph
# contains. `book_of` in the harness reads the book off the gold id, so these
# run against a Golden Vault retriever without anything being written down.
#
# THE ANTHOLOGY DIFFERS FROM THE CAMPAIGN in a way worth watching in the
# results: thirteen adventures share no continuity, every one of them heads a
# section `Using the Golden Vault` and `Adventure Background`, and only the
# introduction is common ground. A question that anchors on a name used in two
# heists is a different problem from anything Barovia poses.

  - id: k01
    question: "What is the Golden Vault and where does it operate from?"
    sections: ["kftgv:introduction-a-collection-of-heists#3"]
    needs: graph
    note: "Secretive, rumoured tied to metallic dragons, based on a good-aligned Outer Plane."

  - id: k02
    question: "What is the Golden Vault's motto?"
    sections: ["kftgv:introduction-a-collection-of-heists#3"]
    needs: text
    note: "Do good, no matter the cost."

